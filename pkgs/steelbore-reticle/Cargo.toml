# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "steelbore-reticle"
version = "0.1.0"
edition = "2021"
description = "Mouse selection, paste and mouse reporting on the Linux virtual consoles: a Rust replacement for gpm."
license = "GPL-3.0-or-later"
authors = ["Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>"]

[dependencies]
clap = { version = "4", features = ["derive"] }
evdev = "0.13"
jiff = "0.2"
rustix = { version = "1", features = ["event", "fs", "termios", "thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Release tuning (Standard §3.2.1). LTO + a single codegen unit shrink this tiny
# binary with no downside. `-C target-cpu=native` is deliberately NOT set: it
# would break Nix build reproducibility and binary-cache reuse, and Stability
# (Priority 1) outranks a negligible perf gain for a daemon that is blocked in
# poll(2) essentially all of the time.
[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
