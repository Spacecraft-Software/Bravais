name: "Copilot Setup Steps"

# Run automatically when this file changes, and allow manual dispatch.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # This job MUST be named `copilot-setup-steps`.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Nix 2.28 or newer is REQUIRED, not merely preferred. `rapg` is a
      # relative path input (`path:./flakes/rapg`, flake.nix), and Nix records
      # that in flake.lock as `{"path":"./flakes/rapg","type":"path"}` with a
      # `parent` and no narHash — there is nothing to hash, the input is inside
      # this repository. Only Nix 2.26+ understands that form; older versions
      # read the missing hash as an unlocked input and refuse outright:
      #
      #   error: lock file contains unlocked input '{"path":"./flakes/rapg",…}'
      #
      # v27 pinned Nix 2.24, so `nix flake check` had never once passed in this
      # job — it failed on every run from the day the input was added. It looked
      # like a flake problem and was a toolchain problem: the same check passes
      # under 2.28.7 and 2.35.1 against the exact URL CI builds, shallow clone
      # and pinned rev included.
      #
      # v31 installs 2.35.1 by default, so no install_url pin is needed; the
      # floor is recorded here so a future downgrade is recognizable.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Validate flake
        run: nix flake check --no-build
