#
# Steelbore Standard §4.3: `reuse lint` MUST pass before shipping.
#
# flake.nix defines checks.reuse-lint, but it only runs under
# `nix flake check`, which builds both channels' full closures and is not a
# usable gate here (CONSTRAINTS.md #17) — so the check existed and never
# fired, and four crates shipped outside REUSE.toml before anyone noticed.
# This job builds that same check, so CI and the flake cannot disagree about
# which `reuse` runs or which files it sees. No branch or path filter: any
# file can break coverage, so a filter would only recreate the gap.
name: REUSE compliance

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  reuse-lint:
    name: reuse lint (§4.3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Same pin as skills-drift.yml and copilot-setup-steps.yml; keep the
      # three in step. copilot-setup-steps.yml explains why Nix 2.28+ is
      # required to evaluate this flake at all (the `rapg` path input).
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build checks.reuse-lint
        run: nix build --no-link -L '.#checks.x86_64-linux.reuse-lint'
