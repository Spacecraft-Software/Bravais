name: Desktop input configuration

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  mouse-workspace-nav:
    name: Mouse configuration and session scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Match the Nix installer in reuse.yml (including its flake settings).
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Validate generated configuration and session scope
        run: >-
          nix build --no-link -L
          '.#checks.x86_64-linux.mouse-workspace-nav'
